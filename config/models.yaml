# The model catalog (plan.md §1, §6): every iPad a listing can resolve to.
#
# `models` are in scope: every iPad that takes the Apple Pencil Pro (§1). `out_of_scope` are
# listed so they resolve to *known, excluded* and drop quietly rather than
# surfacing as *unresolved*, which is a review item (§6). A listing that
# matches neither is unresolved: that is how a new launch shows up (§8).
#
# ── How a title is matched ───────────────────────────────────────────────────
# specs.py reads facts from a title — family, size, chip, generation, year —
# and keeps every model none of them contradicts. A model that declares no
# value for a fact accepts any value of it. The listing resolves only when
# every surviving candidate agrees: one in-scope model, or only out-of-scope
# ones. Anything else is unresolved; nothing is ever defaulted (§6).
#
# `size` is the canonical size in the key; `size_aliases` are other sizes a
# title may state for the same model (the 13" Air measures 12.9" diagonally).
#
# `generations` lists every number retailers use for the model, because the
# numbering schemes disagree:
#   11" Pro  Apple numbers 1–4 by size (11" M2 = 4th). Best Buy continues that
#            count (M4 = 5th, M5 = 6th). The iPad Pro line as a whole counts
#            M1 = 5th, M2 = 6th, M4 = 7th, M5 = 8th. Every number from 3 to 6
#            therefore names two 11" models, and a title carrying only one of
#            those is ambiguous whenever the two straddle the scope boundary.
#   12.9/13" Pro  one count throughout: M1 = 5th, M2 = 6th, M4 = 7th, M5 = 8th.
#   Air      Apple numbered up to the 5th (M1). Retailers' "6th/7th/8th" for
#            M2/M3/M4 is unofficial (§6), so every in-scope Air lists all
#            three: the number tells a post-M1 Air from an older one and
#            nothing more. Best Buy's own titles are consistent (6 = M2,
#            7 = M3, 8 = M4); that is one retailer, not a convention.
#
# `parts` are Apple part numbers without the region suffix, as observed on
# Apple CA pages. A refurbished part swaps the leading M for F (FVW33 is the
# refurb MVW33), so lookup ignores the first letter. A part identifies the
# model; storage and connectivity still come from the title. Listing each
# part's full configuration would be ~120 hand-kept entries for a fact every
# Apple title already states.
#
# `model_numbers` are from Apple's "Identify your iPad model" page
# (support.apple.com/108043). `non_canadian` numbers are China-mainland or
# mmWave (US) variants: they still resolve, and fail the Canadian gate (§1).

models:
  ipad_pro_11_m4:
    family: pro
    chip: M4
    size: 11
    years: [2024]
    generations: [5, 7]
    ram_gb: {default: 8, 1024: 16, 2048: 16}
    model_numbers: {wifi: [A2836], cellular: [A2837], non_canadian: [A3006]}
    # Apple CA refurb grid. Not sold new in CA any more (§1).
    parts: [FVVF3, FVVG3, FVW13, FVW33, FVW43, FWR63, FWR73, FWRP3]

  ipad_pro_13_m4:
