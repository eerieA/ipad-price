# The decision rule (plan.md §1, §2). Edit by hand; nothing here is derived.

# Splits the digest into "within budget" and "over budget"; drops nothing.
# Compared against the listing price, not the effective price: the $1,000 is
# money spent, and a source_adjustment is a preference priced in dollars.
budget: 1000

# The new-price reference is the cheapest new listing for a key over this many
# days, across all sources (§2).
new_reference_days: 30

# Canadian gate (§1). A listing whose part number ends in one of these fails.
# Non-Canadian A-numbers are listed per model in models.yaml (`non_canadian`).
foreign_part_suffixes: ["LL/A"]
